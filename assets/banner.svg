<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Arsenal — guides techniques de cybersécurité">
  <defs>
    <clipPath id="card"><rect width="1200" height="300" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#0d1117"/>
    <rect width="6" height="300" fill="#2fbf8f"/>

    <!-- Monogramme -->
    <g transform="translate(150 150)">
      <rect x="-64" y="-64" width="128" height="128" rx="18" fill="none" stroke="#2fbf8f" stroke-width="3"/>
      <path d="M-32 36 L0 -38 L32 36" fill="none" stroke="#e6edf3" stroke-width="12" stroke-linejoin="miter" stroke-linecap="square"/>
      <rect x="-20" y="10" width="40" height="10" fill="#2fbf8f"/>
    </g>

    <line x1="270" y1="78" x2="270" y2="222" stroke="#30363d" stroke-width="2"/>

    <g font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
      <text x="310" y="138" font-size="72" font-weight="700" fill="#e6edf3" letter-spacing="6">ARSENAL</text>
      <text x="312" y="180" font-size="22" fill="#8b949e">Guides techniques de cybersécurité, du débutant à l'expert</text>
      <text x="312" y="226" font-size="14" font-weight="600" fill="#2fbf8f" letter-spacing="2.5">BLUE TEAM  ·  RED TEAM  ·  REVERSE  ·  INTERNALS  ·  IDENTITÉ &amp; CRYPTO  ·  RÉSEAU</text>
    </g>
  </g>
</svg>
