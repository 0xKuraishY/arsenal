<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Arsenal — guides techniques de cybersécurité">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ee6a8"/>
      <stop offset="1" stop-color="#3b9eff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3ee6a8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3ee6a8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle cx="210" cy="170" r="190" fill="url(#glow)"/>

    <!-- Logo : bouclier hexagonal + viseur -->
    <g transform="translate(210 170)">
      <path d="M0 -112 L97 -56 L97 56 L0 112 L-97 56 L-97 -56 Z" fill="#0b1020" stroke="url(#accent)" stroke-width="5" stroke-linejoin="round"/>
      <path d="M0 -88 L76 -44 L76 44 L0 88 L-76 44 L-76 -44 Z" fill="none" stroke="#3ee6a8" stroke-opacity="0.25" stroke-width="1.5"/>
      <circle r="44" fill="none" stroke="url(#accent)" stroke-width="4"/>
      <circle r="22" fill="none" stroke="#3b9eff" stroke-opacity="0.6" stroke-width="2"/>
      <g stroke="#3ee6a8" stroke-width="4" stroke-linecap="round">
        <line x1="0" y1="-70" x2="0" y2="-52"/>
        <line x1="0" y1="52" x2="0" y2="70"/>
        <line x1="-70" y1="0" x2="-52" y2="0"/>
        <line x1="52" y1="0" x2="70" y2="0"/>
      </g>
      <circle r="6" fill="#3ee6a8"/>
    </g>

    <!-- Titre -->
    <g font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace">
      <text x="370" y="128" font-size="22" fill="#3ee6a8" letter-spacing="2">~/0xKuraishY $ ./arsenal <tspan>█<animate attributeName="fill-opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></tspan></text>
      <text x="366" y="200" font-size="84" font-weight="700" fill="#e8eefc" letter-spacing="10">ARSENAL</text>
      <text x="370" y="240" font-size="21" fill="#9aa8c7">Guides techniques de cybersécurité — du débutant à l'expert</text>

      <!-- Domaines -->
      <g font-size="15" font-weight="600" text-anchor="middle">
        <rect x="370" y="268" width="120" height="32" rx="16" fill="#3b9eff" fill-opacity="0.14" stroke="#3b9eff" stroke-opacity="0.5"/>
        <text x="430" y="289" fill="#7dbcff">BLUE TEAM</text>
        <rect x="502" y="268" width="114" height="32" rx="16" fill="#ff5c7a" fill-opacity="0.14" stroke="#ff5c7a" stroke-opacity="0.5"/>
        <text x="559" y="289" fill="#ff8ea3">RED TEAM</text>
        <rect x="628" y="268" width="96" height="32" rx="16" fill="#c58bff" fill-opacity="0.14" stroke="#c58bff" stroke-opacity="0.5"/>
        <text x="676" y="289" fill="#d8b3ff">REVERSE</text>
        <rect x="736" y="268" width="120" height="32" rx="16" fill="#ffb84d" fill-opacity="0.14" stroke="#ffb84d" stroke-opacity="0.5"/>
        <text x="796" y="289" fill="#ffcf85">INTERNALS</text>
        <rect x="868" y="268" width="164" height="32" rx="16" fill="#3ee6a8" fill-opacity="0.14" stroke="#3ee6a8" stroke-opacity="0.5"/>
        <text x="950" y="289" fill="#7ff0c4">IDENTITÉ·CRYPTO</text>
        <rect x="1044" y="268" width="104" height="32" rx="16" fill="#4dd8e6" fill-opacity="0.14" stroke="#4dd8e6" stroke-opacity="0.5"/>
        <text x="1096" y="289" fill="#8ce8f0">RÉSEAU</text>
      </g>
    </g>

  </g>
</svg>
